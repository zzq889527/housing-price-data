name: Update Housing Price Data

on:
  schedule:
    # 每周日凌晨3点运行
    - cron: '0 3 * * 0'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas openpyxl requests beautifulsoup4 lxml
      timeout-minutes: 5
    
    - name: Run data generation scripts
      run: |
        python scripts/generate_sample_data.py || true
        python scripts/aggregate_data.py || true
      continue-on-error: true
      timeout-minutes: 3
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/ || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update housing price data - $(date +'%Y-%m-%d %H:%M')" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      timeout-minutes: 2
