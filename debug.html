<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房价走势分析 - 调试版</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: scroll; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🔧 房价走势分析 - 调试页面</h1>
    
    <div id="status"></div>
    
    <h3>测试步骤：</h3>
    <button onclick="testStep1()">1. 检查EmbeddedData</button>
    <button onclick="testStep2()">2. 检查DataManager</button>
    <button onclick="testStep3()">3. 检查ChartManager</button>
    <button onclick="testStep4()">4. 测试图表渲染</button>
    <button onclick="runAllTests()">运行所有测试</button>
    
    <h3>调试日志：</h3>
    <div id="log"></div>
    
    <div id="chartContainer" style="width: 100%; height: 400px; margin-top: 20px;"></div>
    
    <!-- 加载本地 ECharts 库 -->
    <script src="js/echarts.min.js"></script>
    <script src="js/embeddedData.js"></script>
    <script>
        let logEl = document.getElementById('log');
        let statusEl = document.getElementById('status');
        
        function log(msg) {
            console.log(msg);
            logEl.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function setStatus(msg, type) {
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = msg;
        }
        
        function testStep1() {
            log('=== 测试1: 检查EmbeddedData ===');
            
            if (typeof window.EmbeddedData === 'undefined') {
                setStatus('❌ EmbeddedData 未定义！embeddedData.js 加载失败', 'error');
                log('❌ window.EmbeddedData 未定义');
                return false;
            }
            
            log('✅ EmbeddedData 已加载');
            log(`   城市元数据数量: ${EmbeddedData.citiesMeta.length}`);
            log(`   城市数据数量: ${Object.keys(EmbeddedData.citiesData).length}`);
            
            const firstCity = Object.keys(EmbeddedData.citiesData)[0];
            const cityData = EmbeddedData.citiesData[firstCity];
            log(`   第一个城市: ${cityData.cityName}`);
            log(`   数据点数量: ${cityData.data.length}`);
            log(`   第一个数据点: ${JSON.stringify(cityData.data[0])}`);
            
            if (EmbeddedData.macroData) {
                log(`✅ 宏观数据已加载`);
                log(`   月度数据数量: ${EmbeddedData.macroData.monthlyData.length}`);
            } else {
                log(`⚠️ 宏观数据未找到`);
            }
            
            setStatus('✅ EmbeddedData 检查通过', 'success');
            return true;
        }
        
        function testStep2() {
            log('=== 测试2: 检查DataManager ===');
            
            if (!testStep1()) return false;
            
            // 模拟DataManager的检测逻辑
            const ua = navigator.userAgent.toLowerCase();
            const isWechat = ua.indexOf('micromessenger') !== -1;
            const isFileProtocol = window.location.protocol === 'file:';
            const hasEmbeddedData = typeof window.EmbeddedData !== 'undefined';
            
            log(`UserAgent: ${ua}`);
            log(`是否在微信浏览器: ${isWechat}`);
            log(`是否file://协议: ${isFileProtocol}`);
            log(`是否有嵌入数据: ${hasEmbeddedData}`);
            
            if ((isWechat || isFileProtocol) && hasEmbeddedData) {
                log('✅ 将使用嵌入数据模式');
            } else {
                log('⚠️ 将使用fetch模式（需要服务器）');
            }
            
            setStatus('✅ DataManager 配置检查完成', 'success');
            return true;
        }
        
        function testStep3() {
            log('=== 测试3: 检查ChartManager (ECharts) ===');
            
            if (typeof echarts === 'undefined') {
                setStatus('❌ ECharts 未加载！请检查网络连接', 'error');
                log('❌ echarts 未定义，可能无法加载CDN');
                return false;
            }
            
            log(`✅ ECharts 已加载，版本: ${echarts.version}`);
            
            // 测试创建图表
            const container = document.getElementById('chartContainer');
            try {
                const chart = echarts.init(container);
                log('✅ ECharts 实例创建成功');
                chart.dispose();
            } catch (e) {
                log(`❌ ECharts 实例创建失败: ${e.message}`);
                return false;
            }
            
            setStatus('✅ ChartManager (ECharts) 检查通过', 'success');
            return true;
        }
        
        function testStep4() {
            log('=== 测试4: 测试图表渲染 ===');
            
            if (!testStep1() || !testStep3()) return false;
            
            const container = document.getElementById('chartContainer');
            const chart = echarts.init(container);
            
            // 使用嵌入数据创建一个简单的测试图表
            const cityData = EmbeddedData.citiesData['beijing'];
            const dates = cityData.data.map(d => d.date);
            const prices = cityData.data.map(d => d.newHousePrice);
            
            const option = {
                title: { text: '测试图表 - 北京新房价格' },
                xAxis: { type: 'category', data: dates },
                yAxis: { type: 'value' },
                series: [{
                    type: 'line',
                    data: prices,
                    name: '新房价格'
                }],
                tooltip: { trigger: 'axis' }
            };
            
            try {
                chart.setOption(option);
                log('✅ 测试图表渲染成功');
                setStatus('✅ 所有测试通过！图表可以正常渲染', 'success');
            } catch (e) {
                log(`❌ 图表渲染失败: ${e.message}`);
                setStatus('❌ 图表渲染失败', 'error');
            }
        }
        
        function runAllTests() {
            logEl.innerHTML = '';
            log('开始运行所有测试...');
            testStep1();
            setTimeout(() => { testStep2(); }, 500);
            setTimeout(() => { testStep3(); }, 1000);
            setTimeout(() => { testStep4(); }, 1500);
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('DOMContentLoaded', () => {
            log('页面加载完成，准备运行测试...');
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
